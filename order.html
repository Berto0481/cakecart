<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF5EB">
<title>Order</title>
<style>
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800 900;font-display:swap}
:root{--wine:#8E1B3A;--berry:#C8324F;--cream:#FBF5EB;--blush:#F9EAEA;--ink:#2A1A20;--soft:#6B5560;--muted:#8C7A80;--line:#F0E4E2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:620px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.lang{position:absolute;top:14px;right:0;display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font-weight:800;font-size:12px;padding:7px 11px;border-radius:99px;color:var(--soft);min-height:34px}
.lang button.on{background:var(--wine);color:#fff}
.head{text-align:center;padding:18px 0 4px;position:relative}
.logo{width:128px;height:128px;object-fit:contain;display:block;margin:0 auto}
.bizname{font-size:30px;font-weight:900;color:var(--wine);margin:8px 0 0}
.hi{color:var(--soft);font-size:15px;margin:10px auto 0;max-width:420px;line-height:1.45}
.title{display:flex;align-items:center;gap:16px;margin:22px 0 14px;color:var(--berry);font-weight:900;letter-spacing:2px;font-size:17px}
.title::before,.title::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ck{position:relative;display:flex;flex-direction:column;background:#fff;border:0;border-radius:22px;overflow:hidden;padding:0;text-align:left;box-shadow:0 6px 18px rgba(142,27,58,.08)}
.ph{position:relative;aspect-ratio:4/3;background:var(--blush);overflow:hidden;display:block;width:100%}
.ph img{position:absolute;display:block}
.ph .bg{inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(16px);transform:scale(1.05)}
.ph .wash{position:absolute;inset:0;background:rgba(251,245,235,.42)}
.ph .fg{inset:0;width:100%;height:100%;object-fit:contain}
.ph .ph0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph .ph0 img{position:static;width:46%;height:auto;opacity:.95}
.ph .ph0 span{font-size:40px;font-weight:900;color:var(--wine);opacity:.5}
.ck .tx{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.ck .nm{font-weight:800;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ck .pr{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;gap:6px}
.ck .pr b{color:var(--berry);font-size:20px;font-weight:900}
.ck .pr b small{font-size:12px;color:var(--muted);font-weight:700}
.ck .pr > small{color:var(--muted);font-weight:700;font-size:12px}
.ck .inbag{position:absolute;top:10px;left:10px;background:var(--wine);color:#fff;font-weight:900;font-size:12px;border-radius:99px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ck .add{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--berry);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.15);line-height:1}
h2{font-size:15px;color:var(--wine);margin:24px 4px 10px;font-weight:900}
.card{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(42,26,32,.05)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .lt{flex:1;min-width:0}
.line .lt b{display:block;font-size:15px}
.line .lt small{color:var(--muted);font-weight:700}
.line .lp{font-weight:900;white-space:nowrap;min-width:52px;text-align:right}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-weight:900;font-size:18px;color:var(--wine);line-height:1}
.mini output{min-width:20px;text-align:center;font-weight:900}
label{display:block;margin-bottom:12px}
label span{display:block;font-weight:800;font-size:13px;color:var(--soft);margin:0 2px 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--berry);box-shadow:0 0 0 3px rgba(200,50,79,.12)}
.seg{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--soft);min-height:40px}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.seg .chip{flex:1;font-size:15px;min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted);margin:6px 4px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,245,235,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;min-width:0}
.bar .tot small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.bar .tot b{font-size:22px;color:var(--berry)}
.send{border:0;border-radius:16px;background:linear-gradient(135deg,var(--berry),var(--wine));color:#fff;font-weight:900;font-size:16px;padding:0 18px;min-height:52px;display:flex;align-items:center;gap:8px}
.send svg{width:22px;height:22px;fill:#fff}
.err{color:var(--berry);font-weight:800;font-size:14px;margin:8px 4px 0;min-height:18px}
.bad{text-align:center;padding:60px 20px;color:var(--soft)}
.scrim{position:fixed;inset:0;background:rgba(42,26,32,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--cream);width:100%;max-width:620px;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.panel .ph{aspect-ratio:16/10;border-radius:26px 26px 0 0}
.panel .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:900;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
.panel .pb{padding:16px 18px 4px}
.panel h3{margin:0;font-size:22px;font-weight:900}
.panel .sec{font-weight:800;font-size:13px;color:var(--soft);margin:16px 2px 8px}
.panel .qty{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.panel .qty .mini button{width:44px;height:44px;font-size:22px}
.panel .qty .mini output{min-width:34px;font-size:20px}
.panel .go{width:100%;margin-top:18px;justify-content:center}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in"><div class="tot"><small id="t_lab"></small><b id="t_val">$0</b></div>
  <button class="send" id="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.2.3-.1.5.2.3.7 1.1 1.4 1.8 1 .9 1.8 1.2 2.1 1.3.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span id="s_lab"></span></button></div></div>
<div id="layer"></div>
<script>
// CakeCart order form: the link carries the cakes and prices (no server). Orders are sent to the baker on WhatsApp.
const W = {
  en: {title:"Order", hi:"Tap a cake to choose its size and extras, then pick a date and send your order on WhatsApp. We’ll confirm the price and details.", menu:"MENU", sizes:n=>`${n} sizes`, bag:"Your order", when:"When", date:"Date you need it", notice:d=>`Please order at least ${d} day${d===1?"":"s"} ahead.`,
       pickup:"Pickup", delivery:"Delivery", fee:f=>`Delivery fee ${f}`, address:"Delivery address", you:"Your details", name:"Your name", phone:"Your phone (optional)", notes:"Notes (optional)",
       notesPh:"Writing on the cake, allergies, time…", total:"Estimated total", items:n=>`${n} item${n===1?"":"s"}`, send:"Send on WhatsApp", size:"Size", extras:"Extras", qty:"How many", add:p=>`Add to order · ${p}`, inBag:n=>`${n} in order`,
       needCake:"Add at least one cake.", needName:"Please add your name.", needDate:"Please choose a date.", tooSoon:d=>`That date is too soon. Please order ${d} day${d===1?"":"s"} ahead.`, needAddr:"Please add the delivery address.",
       msgHi:b=>`Hi ${b}! I’d like to order:`, msgTotal:"Estimated total", msgFor:"For", msgDeliv:"Delivery to", msgPick:"Pickup", msgName:"Name", msgPhone:"Phone", msgNotes:"Notes", code:"Order code for CakeCart", inclFee:f=>`incl. ${f} delivery`, bad:"This order link isn’t complete. Ask the baker for a new one."},
  es: {title:"Orden", hi:"Toca un bizcocho para escoger el tamaño y los extras; luego escoge la fecha y envía tu orden por WhatsApp. Te confirmamos el precio y los detalles.", menu:"MENÚ", sizes:n=>`${n} tamaños`, bag:"Tu orden", when:"Cuándo", date:"Fecha que lo necesitas", notice:d=>`Ordena con al menos ${d} día${d===1?"":"s"} de anticipación.`,
       pickup:"Para recoger", delivery:"Entrega", fee:f=>`Cargo de entrega ${f}`, address:"Dirección de entrega", you:"Tus datos", name:"Tu nombre", phone:"Tu teléfono (opcional)", notes:"Notas (opcional)",
       notesPh:"Mensaje en el bizcocho, alergias, hora…", total:"Total estimado", items:n=>`${n} artículo${n===1?"":"s"}`, send:"Enviar por WhatsApp", size:"Tamaño", extras:"Extras", qty:"Cantidad", add:p=>`Añadir a la orden · ${p}`, inBag:n=>`${n} en la orden`,
       needCake:"Añade al menos un bizcocho.", needName:"Escribe tu nombre.", needDate:"Escoge una fecha.", tooSoon:d=>`Esa fecha es muy pronto. Ordena con ${d} día${d===1?"":"s"} de anticipación.`, needAddr:"Escribe la dirección de entrega.",
       msgHi:b=>`¡Hola ${b}! Quisiera ordenar:`, msgTotal:"Total estimado", msgFor:"Para", msgDeliv:"Entrega en", msgPick:"Para recoger", msgName:"Nombre", msgPhone:"Teléfono", msgNotes:"Notas", code:"Código de orden para CakeCart", inclFee:f=>`incluye ${f} de entrega`, bad:"Este enlace de orden no está completo. Pídele uno nuevo al repostero."}
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + (Math.round(v * 100) % 100 === 0 ? Math.round(v) : v.toFixed(2));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const slugify = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let D = null;
try { const h = new URLSearchParams(location.hash.slice(1)).get("d"); D = JSON.parse(b64d(h)); if (!D || !Array.isArray(D.c) || !D.w) D = null; } catch(e) { D = null; }
let L = (D && D.l === "es") ? "es" : "en";
const bag = [];   // each line: {id, s (size index), a: [add-on ids], q}
let method = "", st = {name:"", phone:"", date:"", addr:"", notes:""};
const shop = D && D.s ? `shops/${D.s}/` : "";
const cakeOf = id => D.c.find(c => c[0] === id);
const sizes = c => Array.isArray(c[3]) ? c[3] : [["", c[3], 1]];
const baseIdx = c => Math.max(0, sizes(c).findIndex(x => x[2]));
const cname = c => (L === "es" && c[2]) || c[1];
const addonsOf = ids => (D.a || []).filter(a => ids.includes(a[0]));
const unitPrice = (c, s, ids) => (+(sizes(c)[s] || sizes(c)[0])[1] || 0) + addonsOf(ids).reduce((t, a) => t + (+a[2] || 0), 0);
const fee = () => method === "delivery" && D.f > 0 ? +D.f : 0;
const total = () => bag.reduce((t, l) => t + unitPrice(cakeOf(l.id), l.s, l.a) * l.q, 0) + fee();
const count = () => bag.reduce((t, l) => t + l.q, 0);
const minDate = () => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + (+D.d || 0)); return d.toISOString().slice(0,10); };
// Photo: the baker's own (hosted in their shop folder), then a sample (testing only), else their logo as a placeholder
function photo(c){
  const srcs = [shop && `${shop}${slugify(c[0])}.webp`, c[4]].filter(Boolean), letter = esc((cname(c)[0] || "").toUpperCase());
  return `<span class="ph" data-srcs="${esc(JSON.stringify(srcs))}"><span class="ph0">${shop ? `<img src="${shop}logo.webp" alt="" data-letter="${letter}">` : `<span>${letter}</span>`}</span></span>`;
}
function loadPhotos(root){
  root.querySelectorAll(".ph0 img[data-letter]").forEach(im => im.onerror = () => { const s = document.createElement("span"); s.textContent = im.dataset.letter; im.replaceWith(s); });
  root.querySelectorAll(".ph[data-srcs]").forEach(ph => { const srcs = JSON.parse(ph.dataset.srcs); ph.removeAttribute("data-srcs");
    const tryNext = i => { if (i >= srcs.length) return; const im = new Image();
      im.onload = () => { ph.insertAdjacentHTML("afterbegin", `<img class="bg" src="${esc(srcs[i])}" alt=""><span class="wash"></span><img class="fg" src="${esc(srcs[i])}" alt="">`); const p0 = ph.querySelector(".ph0"); if (p0) p0.remove(); };
      im.onerror = () => tryNext(i + 1); im.src = srcs[i]; };
    tryNext(0); });
}
function render(){
  const T = W[L]; document.documentElement.lang = L; document.title = `${T.title} · ${D.b || "CakeCart"}`;
  const inBag = id => bag.filter(l => l.id === id).reduce((t, l) => t + l.q, 0);
  document.getElementById("app").innerHTML = `
    <div class="head"><div class="lang"><button class="${L==="en"?"on":""}" data-l="en">EN</button><button class="${L==="es"?"on":""}" data-l="es">ES</button></div>
      ${shop ? `<img class="logo" id="logo" src="${shop}logo.webp" alt="${esc(D.b || "")}">` : ""}
      <p class="bizname" id="bn" ${shop ? "hidden" : ""}>${esc(D.b || "CakeCart")}</p>
      <p class="hi">${esc(T.hi)}</p></div>
    <div class="title">${esc(T.menu)}</div>
    <div class="grid">${D.c.map(c => { const sz = sizes(c), b = sz[baseIdx(c)], n = inBag(c[0]);
      return `<button class="ck" data-id="${esc(c[0])}">${photo(c)}${n ? `<span class="inbag">${esc(T.inBag(n))}</span>` : ""}<span class="add" aria-hidden="true">+</span>
        <span class="tx"><span class="nm">${esc(cname(c))}</span><span class="pr"><b>${esc(money(+b[1]))}</b><small>${esc(b[0] || "")}${sz.length > 1 ? ` · ${esc(T.sizes(sz.length))}` : ""}</small></span></span></button>`; }).join("")}</div>
    ${bag.length ? `<h2>${esc(T.bag)}</h2><div class="card">${bag.map((l, i) => { const c = cakeOf(l.id), sz = sizes(c)[l.s], ads = addonsOf(l.a);
      return `<div class="line" data-i="${i}"><div class="lt"><b>${esc(cname(c))}${sz && sz[0] ? ` · ${esc(sz[0])}` : ""}</b>${ads.length ? `<small>+ ${esc(ads.map(a => a[1]).join(", "))}</small>` : ""}</div>
        <div class="mini"><button class="lm" aria-label="One less">−</button><output>${l.q}</output><button class="lp2" aria-label="One more">+</button></div><span class="lp">${esc(money(unitPrice(c, l.s, l.a) * l.q))}</span></div>`; }).join("")}</div>` : ""}
    <h2>${esc(T.when)}</h2>
    <div class="card">
      <label><span>${esc(T.date)}</span><input type="date" id="f_date" min="${minDate()}" value="${esc(st.date)}"></label>
      ${+D.d ? `<p class="note" style="margin-top:-4px">${esc(T.notice(+D.d))}</p>` : ""}
      <div class="seg" style="margin-top:12px"><button class="chip ${method==="pickup"?"on":""}" data-m="pickup">${esc(T.pickup)}</button>${D.f >= 0 ? `<button class="chip ${method==="delivery"?"on":""}" data-m="delivery">${esc(T.delivery)}</button>` : ""}</div>
      ${method === "delivery" ? `${D.f > 0 ? `<p class="note">${esc(T.fee(money(+D.f)))}</p>` : ""}<label style="margin:12px 0 0"><span>${esc(T.address)}</span><input id="f_addr" value="${esc(st.addr)}" autocomplete="street-address"></label>` : ""}
    </div>
    <h2>${esc(T.you)}</h2>
    <div class="card">
      <label><span>${esc(T.name)}</span><input id="f_name" value="${esc(st.name)}" autocomplete="name"></label>
      <label><span>${esc(T.phone)}</span><input id="f_phone" type="tel" value="${esc(st.phone)}" autocomplete="tel"></label>
      <label style="margin:0"><span>${esc(T.notes)}</span><textarea id="f_notes" rows="3" placeholder="${esc(T.notesPh)}">${esc(st.notes)}</textarea></label>
    </div>
    <p class="err" id="err" role="alert"></p>`;
  const lg = document.getElementById("logo"); if (lg) lg.onerror = () => { lg.remove(); document.getElementById("bn").hidden = false; };
  loadPhotos(document.getElementById("app"));
  document.getElementById("bar").hidden = false;
  document.getElementById("t_lab").textContent = `${T.total}${count() ? ` · ${T.items(count())}` : ""}`; document.getElementById("t_val").textContent = money(total()); document.getElementById("s_lab").textContent = T.send;
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { keep(); L = b.dataset.l; render(); });
  document.querySelectorAll(".ck").forEach(b => b.onclick = () => { keep(); openCake(b.dataset.id); });
  document.querySelectorAll(".line").forEach(row => { const i = +row.dataset.i, l = bag[i];
    row.querySelector(".lp2").onclick = () => { keep(); l.q++; render(); };
    row.querySelector(".lm").onclick = () => { keep(); l.q--; if (l.q <= 0) bag.splice(i, 1); render(); }; });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { keep(); method = method === b.dataset.m ? "" : b.dataset.m; render(); });
  document.getElementById("send").onclick = () => { keep(); send(); };
}
function keep(){ for (const k of ["name","phone","date","addr","notes"]) { const el = document.getElementById("f_" + k); if (el) st[k] = el.value; } }
// One cake's panel: size, extras and how many. Each "Add" is its own line, so different sizes of the same cake can be ordered.
function openCake(id){
  const T = W[L], c = cakeOf(id), sz = sizes(c); let s = baseIdx(c), q = 1; const a = new Set();
  const layer = document.getElementById("layer");
  const paint = () => {
    const price = unitPrice(c, s, [...a]) * q;
    layer.innerHTML = `<div class="scrim"><div class="panel" role="dialog" aria-label="${esc(cname(c))}"><div style="position:relative">${photo(c)}<button class="x" aria-label="Close">×</button></div>
      <div class="pb"><h3>${esc(cname(c))}</h3>
        ${sz.length > 1 ? `<div class="sec">${esc(T.size)}</div><div class="chips">${sz.map((x, i) => `<button class="chip ${i===s?"on":""}" data-s="${i}">${esc(x[0])} · ${esc(money(+x[1]))}</button>`).join("")}</div>` : (sz[0][0] ? `<div class="sec">${esc(sz[0][0])}</div>` : "")}
        ${(D.a || []).length ? `<div class="sec">${esc(T.extras)}</div><div class="chips">${D.a.map(x => `<button class="chip ${a.has(x[0])?"on":""}" data-a="${esc(x[0])}">+ ${esc(x[1])} · ${esc(money(+x[2]))}</button>`).join("")}</div>` : ""}
        <div class="qty"><div class="sec" style="margin:0">${esc(T.qty)}</div><div class="mini"><button class="qm" aria-label="One less">−</button><output>${q}</output><button class="qp" aria-label="One more">+</button></div></div>
        <button class="send go">${esc(T.add(money(price)))}</button></div></div></div>`;
    loadPhotos(layer);
    const close = () => { layer.innerHTML = ""; };
    layer.querySelector(".scrim").onclick = e => { if (e.target.classList.contains("scrim")) close(); };
    layer.querySelector(".x").onclick = close;
    layer.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { s = +b.dataset.s; paint(); });
    layer.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { a.has(b.dataset.a) ? a.delete(b.dataset.a) : a.add(b.dataset.a); paint(); });
    layer.querySelector(".qm").onclick = () => { if (q > 1) q--; paint(); };
    layer.querySelector(".qp").onclick = () => { q++; paint(); };
    layer.querySelector(".go").onclick = () => {
      const ids = [...a].sort(), same = bag.find(l => l.id === id && l.s === s && l.a.join() === ids.join());
      if (same) same.q += q; else bag.push({id, s, a: ids, q});
      close(); render();
    };
  };
  paint();
}
function send(){
  const T = W[L], err = m => { const e = document.getElementById("err"); e.textContent = m; e.scrollIntoView({block:"center", behavior:"smooth"}); };
  if (!bag.length) return err(T.needCake);
  if (!st.date) return err(T.needDate);
  if (st.date < minDate()) return err(T.tooSoon(+D.d));
  if (method === "delivery" && !st.addr.trim()) return err(T.needAddr);
  if (!st.name.trim()) return err(T.needName);
  const fmtDate = new Date(st.date + "T12:00:00").toLocaleDateString(L === "es" ? "es-PR" : "en-US", {weekday:"long", month:"long", day:"numeric"});
  const lines = bag.map(l => { const c = cakeOf(l.id), sz = sizes(c)[l.s] || sizes(c)[0], ads = addonsOf(l.a);
    return {l, c, sz, ads, text: `• ${l.q} × ${cname(c)}${sz[0] ? ` (${sz[0]})` : ""}${ads.length ? ` + ${ads.map(a => a[1]).join(", ")}` : ""} – ${money(unitPrice(c, l.s, l.a) * l.q)}`}; });
  const code = b64e(JSON.stringify({n: st.name.trim(), p: st.phone.trim(), d: st.date, m: method, ad: st.addr.trim(), t: st.notes.trim(), f: fee(),
    i: lines.map(x => [x.c[0], x.l.q, x.sz[0] || "", x.l.a, unitPrice(x.c, x.l.s, x.l.a)])}));
  const msg = [T.msgHi(D.b || ""), ...lines.map(x => x.text), "",
    `${T.msgTotal}: ${money(total())}${fee() ? ` (${T.inclFee(money(fee()))})` : ""}`,
    `${T.msgFor}: ${fmtDate}${method === "pickup" ? ` · ${T.msgPick}` : ""}`,
    ...(method === "delivery" ? [`${T.msgDeliv}: ${st.addr.trim()}`] : []),
    `${T.msgName}: ${st.name.trim()}`, ...(st.phone.trim() ? [`${T.msgPhone}: ${st.phone.trim()}`] : []), ...(st.notes.trim() ? [`${T.msgNotes}: ${st.notes.trim()}`] : []),
    "", `${T.code}: CC1.${code}`].join("\n");
  location.href = `https://wa.me/${String(D.w).replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("layer").innerHTML = ""; });
if (D) render(); else document.getElementById("app").innerHTML = `<p class="bad">${esc(W[L].bad)}</p>`;
