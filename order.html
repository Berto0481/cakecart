<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF5EB">
<title>Order</title>

<style>
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800 900;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--wine:#8E1B3A;--berry:#C8324F;--cream:#FBF5EB;--blush:#F9EAEA;--ink:#2A1A20;--soft:#6B5560;--muted:#8C7A80;--line:#F0E4E2;--green:#2E7D4F}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(120px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 6px}
h1{margin:0;font-size:26px;color:var(--wine);font-weight:900;line-height:1.15}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px;flex:none}
.lang button{border:0;background:none;font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border-radius:99px;color:var(--soft);min-height:36px}
.lang button.on{background:var(--wine);color:#fff}
.sub{color:var(--soft);margin:0 0 16px;font-size:15px}
.card{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(42,26,32,.05)}
.cake .top{display:flex;align-items:center;gap:12px}
.cake .nm{flex:1;min-width:0}
.cake .nm b{display:block;font-size:16px}
.cake .nm small{color:var(--muted);font-weight:700}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:22px;font-weight:800;color:var(--wine);line-height:1}
.step button.plus{background:var(--berry);border-color:var(--berry);color:#fff}
.step output{min-width:22px;text-align:center;font-weight:900;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-weight:800;font-size:13px;color:var(--soft);min-height:36px}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
h2{font-size:15px;color:var(--wine);margin:22px 4px 8px;font-weight:900}
label{display:block;margin-bottom:12px}
label span{display:block;font-weight:800;font-size:13px;color:var(--soft);margin:0 2px 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--berry);box-shadow:0 0 0 3px rgba(200,50,79,.12)}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;font-size:15px;min-height:46px}
.note{font-size:13px;color:var(--muted);margin:6px 4px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,245,235,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1}
.bar .tot small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.bar .tot b{font-size:22px;color:var(--berry)}
.send{border:0;border-radius:16px;background:linear-gradient(135deg,var(--berry),var(--wine));color:#fff;font:inherit;font-weight:900;font-size:16px;padding:0 20px;min-height:52px;display:flex;align-items:center;gap:8px}
.send svg{width:22px;height:22px;fill:#fff}
.err{color:var(--berry);font-weight:800;font-size:14px;margin:8px 4px 0;min-height:18px}
.bad{text-align:center;padding:60px 20px;color:var(--soft)}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in"><div class="tot"><small id="t_lab">Estimated total</small><b id="t_val">$0</b></div>
  <button class="send" id="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.2.3-.1.5.2.3.7 1.1 1.4 1.8 1 .9 1.8 1.2 2.1 1.3.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span id="s_lab">Send on WhatsApp</span></button></div></div>
<script>
// CakeCart order form: everything comes from the link (no server). Sends the order to the baker on WhatsApp.
const W = {
  en: {title:"Order", hi:"Pick your cakes, choose a date and send your order on WhatsApp. We’ll confirm the price and details.", cakes:"Cakes", when:"When", date:"Date you need it", notice:d=>`Please order at least ${d} day${d===1?"":"s"} ahead.`,
       pickup:"Pickup", delivery:"Delivery", fee:f=>`Delivery fee ${f}`, address:"Delivery address", you:"Your details", name:"Your name", phone:"Your phone (optional)", notes:"Notes (optional)",
       notesPh:"Writing on the cake, allergies, time…", total:"Estimated total", send:"Send on WhatsApp", needCake:"Add at least one cake.", needName:"Please add your name.", needDate:"Please choose a date.", tooSoon:d=>`That date is too soon. Please order ${d} day${d===1?"":"s"} ahead.`, needAddr:"Please add the delivery address.",
       msgHi:b=>`Hi ${b}! I’d like to order:`, msgTotal:"Estimated total", msgFor:"For", msgDeliv:"Delivery to", msgPick:"Pickup", msgName:"Name", msgPhone:"Phone", msgNotes:"Notes", code:"Order code for CakeCart", inclFee:f=>`incl. ${f} delivery`, bad:"This order link isn’t complete. Ask the baker for a new one."},
  es: {title:"Orden", hi:"Escoge tus bizcochos, la fecha y envía tu orden por WhatsApp. Te confirmamos el precio y los detalles.", cakes:"Bizcochos", when:"Cuándo", date:"Fecha que lo necesitas", notice:d=>`Ordena con al menos ${d} día${d===1?"":"s"} de anticipación.`,
       pickup:"Para recoger", delivery:"Entrega", fee:f=>`Cargo de entrega ${f}`, address:"Dirección de entrega", you:"Tus datos", name:"Tu nombre", phone:"Tu teléfono (opcional)", notes:"Notas (opcional)",
       notesPh:"Mensaje en el bizcocho, alergias, hora…", total:"Total estimado", send:"Enviar por WhatsApp", needCake:"Añade al menos un bizcocho.", needName:"Escribe tu nombre.", needDate:"Escoge una fecha.", tooSoon:d=>`Esa fecha es muy pronto. Ordena con ${d} día${d===1?"":"s"} de anticipación.`, needAddr:"Escribe la dirección de entrega.",
       msgHi:b=>`¡Hola ${b}! Quisiera ordenar:`, msgTotal:"Total estimado", msgFor:"Para", msgDeliv:"Entrega en", msgPick:"Para recoger", msgName:"Nombre", msgPhone:"Teléfono", msgNotes:"Notas", code:"Código de orden para CakeCart", inclFee:f=>`incluye ${f} de entrega`, bad:"Este enlace de orden no está completo. Pídele uno nuevo al repostero."}
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + (Math.round(v) === v ? v : v.toFixed(2));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
let D = null;
try { const h = new URLSearchParams(location.hash.slice(1)).get("d"); D = JSON.parse(b64d(h)); if (!D || !Array.isArray(D.c) || !D.w) D = null; } catch(e) { D = null; }
let L = (D && D.l === "es") ? "es" : "en";
const pick = {};   // cake id -> {q, s (size index), a: Set of add-on ids}
let method = "", st = {name:"", phone:"", date:"", addr:"", notes:""};
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const minDate = () => { const d = today(); d.setDate(d.getDate() + (D ? +D.d || 0 : 0)); return d.toISOString().slice(0,10); };
const sizes = c => Array.isArray(c[3]) ? c[3] : [["", c[3]]];
const cname = c => (L === "es" && c[2]) || c[1];
function unit(c){ const p = pick[c[0]] || {s:0, a:new Set()}; const sz = sizes(c)[p.s] || sizes(c)[0]; let v = +sz[1] || 0; for (const a of D.a || []) if (p.a && p.a.has(a[0])) v += +a[2] || 0; return v; }
function total(){ let t = 0; for (const c of D.c) { const p = pick[c[0]]; if (p && p.q) t += unit(c) * p.q; } if (method === "delivery" && D.f > 0) t += +D.f; return t; }
function render(){
  const T = W[L]; document.documentElement.lang = L; document.title = `${T.title} · ${D.b || "CakeCart"}`;
  document.getElementById("app").innerHTML = `
    <header><h1>${esc(D.b || "CakeCart")}</h1><div class="lang"><button class="${L==="en"?"on":""}" data-l="en">EN</button><button class="${L==="es"?"on":""}" data-l="es">ES</button></div></header>
    <p class="sub">${esc(T.hi)}</p>
    <h2>${esc(T.cakes)}</h2>
    ${D.c.map(c => { const p = pick[c[0]] || {q:0, s:0, a:new Set()}, sz = sizes(c);
      return `<div class="card cake" data-id="${esc(c[0])}"><div class="top"><div class="nm"><b>${esc(cname(c))}</b><small>${esc(money(unit(c)))}${sz[p.s] && sz[p.s][0] ? ` · ${esc(sz[p.s][0])}` : ""}</small></div>
        <div class="step"><button class="minus" aria-label="One less">−</button><output>${p.q}</output><button class="plus" aria-label="One more">+</button></div></div>
        ${p.q && sz.length > 1 ? `<div class="chips">${sz.map((x, i) => `<button class="chip ${i===p.s?"on":""}" data-s="${i}">${esc(x[0])} · ${esc(money(+x[1]))}</button>`).join("")}</div>` : ""}
        ${p.q && (D.a || []).length ? `<div class="chips">${D.a.map(a => `<button class="chip ${p.a.has(a[0])?"on":""}" data-a="${esc(a[0])}">+ ${esc(a[1])} · ${esc(money(+a[2]))}</button>`).join("")}</div>` : ""}</div>`; }).join("")}
    <h2>${esc(T.when)}</h2>
    <div class="card">
      <label><span>${esc(T.date)}</span><input type="date" id="f_date" min="${minDate()}" value="${esc(st.date)}"></label>
      ${+D.d ? `<p class="note">${esc(T.notice(+D.d))}</p>` : ""}
      <div class="seg" style="margin-top:12px"><button class="chip ${method==="pickup"?"on":""}" data-m="pickup">${esc(T.pickup)}</button>${D.f >= 0 ? `<button class="chip ${method==="delivery"?"on":""}" data-m="delivery">${esc(T.delivery)}</button>` : ""}</div>
      ${method === "delivery" ? `${D.f > 0 ? `<p class="note">${esc(T.fee(money(+D.f)))}</p>` : ""}<label style="margin-top:12px"><span>${esc(T.address)}</span><input id="f_addr" value="${esc(st.addr)}" autocomplete="street-address"></label>` : ""}
    </div>
    <h2>${esc(T.you)}</h2>
    <div class="card">
      <label><span>${esc(T.name)}</span><input id="f_name" value="${esc(st.name)}" autocomplete="name"></label>
      <label><span>${esc(T.phone)}</span><input id="f_phone" type="tel" value="${esc(st.phone)}" autocomplete="tel"></label>
      <label style="margin:0"><span>${esc(T.notes)}</span><textarea id="f_notes" rows="3" placeholder="${esc(T.notesPh)}">${esc(st.notes)}</textarea></label>
    </div>
    <p class="err" id="err" role="alert"></p>`;
  document.getElementById("bar").hidden = false;
  document.getElementById("t_lab").textContent = T.total; document.getElementById("t_val").textContent = money(total()); document.getElementById("s_lab").textContent = T.send;
  const keep = () => { for (const k of ["name","phone","date","addr","notes"]) { const el = document.getElementById("f_" + k); if (el) st[k] = el.value; } };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { keep(); L = b.dataset.l; render(); });
  document.querySelectorAll(".cake").forEach(card => { const id = card.dataset.id, p = pick[id] = pick[id] || {q:0, s:Math.max(0, (sizes(D.c.find(c => c[0] === id))).findIndex(x => x[2])), a:new Set()};
    card.querySelector(".plus").onclick = () => { keep(); p.q++; render(); };
    card.querySelector(".minus").onclick = () => { keep(); if (p.q) p.q--; render(); };
    card.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { keep(); p.s = +b.dataset.s; render(); });
    card.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { keep(); p.a.has(b.dataset.a) ? p.a.delete(b.dataset.a) : p.a.add(b.dataset.a); render(); }); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { keep(); method = method === b.dataset.m ? "" : b.dataset.m; render(); });
  document.getElementById("send").onclick = () => { keep(); send(); };
}
function send(){
  const T = W[L], err = m => { document.getElementById("err").textContent = m; document.getElementById("err").scrollIntoView({block:"center", behavior:"smooth"}); };
  const lines = D.c.filter(c => pick[c[0]] && pick[c[0]].q);
  if (!lines.length) return err(T.needCake);
  if (!st.date) return err(T.needDate);
  if (st.date < minDate()) return err(T.tooSoon(+D.d));
  if (method === "delivery" && !st.addr.trim()) return err(T.needAddr);
  if (!st.name.trim()) return err(T.needName);
  const fmtDate = new Date(st.date + "T12:00:00").toLocaleDateString(L === "es" ? "es-PR" : "en-US", {weekday:"long", month:"long", day:"numeric"});
  const items = lines.map(c => { const p = pick[c[0]], sz = sizes(c)[p.s] || sizes(c)[0], ads = (D.a || []).filter(a => p.a.has(a[0]));
    return {c, p, sz, ads, text: `• ${p.q} × ${cname(c)}${sz[0] ? ` (${sz[0]})` : ""}${ads.length ? ` + ${ads.map(a => a[1]).join(", ")}` : ""} – ${money(unit(c) * p.q)}`}; });
  const fee = method === "delivery" && D.f > 0 ? +D.f : 0;
  const code = b64e(JSON.stringify({n: st.name.trim(), p: st.phone.trim(), d: st.date, m: method, ad: st.addr.trim(), t: st.notes.trim(), f: fee,
    i: items.map(x => [x.c[0], x.p.q, x.sz[0] || "", x.ads.map(a => a[0]), unit(x.c)])}));
  const msg = [T.msgHi(D.b || ""), ...items.map(x => x.text), "",
    `${T.msgTotal}: ${money(total())}${fee ? ` (${T.inclFee(money(fee))})` : ""}`,
    `${T.msgFor}: ${fmtDate}${method === "pickup" ? ` · ${T.msgPick}` : ""}`,
    ...(method === "delivery" ? [`${T.msgDeliv}: ${st.addr.trim()}`] : []),
    `${T.msgName}: ${st.name.trim()}`, ...(st.phone.trim() ? [`${T.msgPhone}: ${st.phone.trim()}`] : []), ...(st.notes.trim() ? [`${T.msgNotes}: ${st.notes.trim()}`] : []),
    "", `${T.code}: CC1.${code}`].join("\n");
  location.href = `https://wa.me/${String(D.w).replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
}
if (D) render(); else document.getElementById("app").innerHTML = `<p class="bad">${esc(W[L].bad)}</p>`;
</script>
</body>
</html>
