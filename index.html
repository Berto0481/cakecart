<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EB">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="CakeCart: your recipes, ingredient prices, cake pricing and shopping list.">
<title>CakeCart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <!-- CAKES -->
  <section class="screen on" id="cakes">
    <header class="brand">
      <img src="icons/logo.png" alt="" class="logo">
      <span class="wordmark">CakeCart</span>
      <button class="icon gear" id="openSettings" aria-label="Settings and backup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="hello">
      <div class="hirow"><h1>Hi there!</h1><button class="icon reset idle" id="clearCakes" aria-label="Clear chosen cakes"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button></div>
      <p>What would you like to bake?</p>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search cheesecakes, brownies…" autocomplete="off">
    </label>
    <div class="chips" id="cats"></div>
    <div id="cakeList" class="cakelist"></div>
    <div class="spacer"></div>
    <div class="cta hide" id="cta">
      <button class="primary" id="make"><span id="ctaText">Make shopping list</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- SHOPPING LIST -->
  <section class="screen" id="list">
    <header class="bar">
      <button class="icon" data-go="cakes" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <div class="bartitle"><h2>Shopping List</h2><p>Combined ingredients for your selected recipes</p></div>
      <button class="icon" id="uncheck" aria-label="Uncheck all"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
    </header>
    <div id="listBody"></div>
    <div class="spacer"></div>
    <div class="totalbar" id="totalbar"><span>Estimated Total</span><strong id="total">$0.00</strong></div>
  </section>

  <!-- ORDERS -->
  <section class="screen" id="orders">
    <header class="bar">
      <span class="eyespacer"></span>
      <div class="bartitle"><h2>Orders</h2><p>What's due, what's paid, what you made</p></div>
      <button class="eyepill" id="moneyToggle" aria-label="Hide amounts"></button>
      <button class="icon add" id="newOrder" aria-label="New order"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <div id="ordersBody"></div>
    <div class="spacer"></div>
  </section>

  <!-- RECIPES -->
  <section class="screen" id="recipes">
    <header class="bar">
      <span class="icon ghost"></span>
      <div class="bartitle"><h2>Recipes</h2><p>Cost and selling price for each cake</p></div>
      <button class="icon add" id="newRecipe" aria-label="New recipe"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="rq" type="search" placeholder="Search recipes…" autocomplete="off">
    </label>
    <div id="recipeList"></div>
    <div class="spacer"></div>
  </section>

  <!-- INGREDIENTS -->
  <section class="screen" id="ingredients">
    <header class="bar">
      <span class="icon ghost"></span>
      <div class="bartitle"><h2>Ingredients</h2><p>Your store prices and what's at home</p></div>
      <button class="icon add" id="newIng" aria-label="New ingredient"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="iq" type="search" placeholder="Search ingredients…" autocomplete="off">
    </label>
    <div class="filterrow"><div class="chips" id="ingFilters"></div><button class="icon idle" id="clearHave" aria-label="Uncheck all Have"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button></div>
    <div id="ingList"></div>
    <div class="spacer"></div>
  </section>

  <nav class="tabbar">
    <button data-go="cakes" class="on"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 8H7"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Cakes</span></button>
    <button data-go="list"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Shopping</span><i class="dot" id="listBadge"></i></button>
    <button data-go="orders"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3"/></svg><span>Orders</span><i class="dot" id="orderBadge"></i></button>
    <button data-go="recipes"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM4 17a2 2 0 0 1 2-2h12"/><path d="M9 7h5M9 10h5"/></svg><span>Recipes</span></button>
    <button data-go="ingredients"><svg viewBox="0 0 24 24"><path d="M20 12V8l-8-5-8 5v4"/><path d="M4 12h16l-1.5 7.2A2 2 0 0 1 16.5 21h-9a2 2 0 0 1-2-1.8z"/><path d="M12 12v5"/></svg><span>Ingredients</span></button>
  </nav>
</div>
<div id="sheets"></div>
<div class="toast" id="toast"></div>
<script src="defaults.js"></script>
<script src="app.js"></script>
</body>
</html>
